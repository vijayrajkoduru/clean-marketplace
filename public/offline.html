<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b685a" />
    <title>You are offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7f6;
        color: #0f1f1c;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 22rem;
        padding: 2rem 1.5rem;
        text-align: center;
      }
      .icon {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto;
        border-radius: 1rem;
        display: grid;
        place-items: center;
        background: #eefbf8;
        color: #0b685a;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.4rem;
      }
      p {
        margin: 0;
        color: #5b6b67;
        line-height: 1.5;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.8rem 1.5rem;
        border: 0;
        border-radius: 0.75rem;
        background: #0b685a;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h.01" /><path d="M8.5 16.43a5 5 0 0 1 7 0" /><path d="M5 12.86a10 10 0 0 1 5.17-2.69" /><path d="M19 12.86a10 10 0 0 0-2-1.39" /><path d="M2 8.82a15 15 0 0 1 4.18-2.65" /><path d="M22 8.82a15 15 0 0 0-11.29-3.76" /><path d="m2 2 20 20" />
        </svg>
      </div>
      <h1>You are offline</h1>
      <p>Check your mobile data or Wi-Fi, then try again. Your bookings are safe.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
